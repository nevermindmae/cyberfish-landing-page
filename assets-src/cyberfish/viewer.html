<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CyberFish GLB check</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 40%, #e9ecf1 0%, #c9ced6 100%); }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 10px; font: 13px/1.4 system-ui, sans-serif; color: #333; }
  #hud a { color: #1565c0; margin-right: 10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <a href="?m=cyberfish_posed.glb">posed</a><a href="?m=cyberfish_straight.glb">straight</a>
  <span id="info">loading…</span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const model = new URLSearchParams(location.search).get('m') || 'cyberfish_posed.glb';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.enableDamping = true;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-5, 8, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd8ff, 1.2); rim.position.set(4, -2, -6); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.5, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
scene.background = new THREE.Color(0xcfd4db);

let fish;
const pivot = new THREE.Group(); scene.add(pivot);
new GLTFLoader().load(model, (gltf) => {
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  root.position.sub(c);
  pivot.add(root); fish = pivot;
  let tris = 0; fish.traverse(o => { if (o.isMesh) tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; });
  document.getElementById('info').textContent = `${model} · ${Math.round(tris).toLocaleString()} tris · size ${box.getSize(new THREE.Vector3()).toArray().map(v => v.toFixed(1)).join(' × ')}`;
}, undefined, (e) => { document.getElementById('info').textContent = 'load error: ' + e; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (fish) fish.rotation.y += 0.003;
  controls.update(); composer.render();
});
</script>
</body>
</html>

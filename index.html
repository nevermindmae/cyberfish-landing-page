<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeKoi by CyberFish</title>
    <meta
      name="description"
      content="DeKoi is a small box you plug into your home or office network. It pretends to be a storage drive. If something touches it, you get an alert on your phone within a minute."
    />
    <link rel="icon" type="image/svg+xml" href="/cyberfish-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      Loader styles are inlined so the overlay paints before any module
      script (three.js included) has been fetched or executed.
    -->
    <style>
      #loader {
        /* Dock: the mark settles to --dock-scale, nudged up by --dock-lift, over
           --dock-ms. --rise is how far the mark's bottom edge moves, i.e.
           boxHeight * (1 - scale) / 2 + scale * lift, so the wordmark and
           buttons follow it. Box is 320px wide, 126px tall on desktop. */
        --dock-scale: 0.65;
        --dock-lift: 40px;
        --dock-ms: 1600ms;
        --rise: 48px;
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #060a14;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: opacity 600ms;
      }
      /* Horizontal scanline texture, after the app icon (3/7 duty, ~8% white). */
      #loader::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.085) 0 1px,
          transparent 1px 4px
        );
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #mark {
        width: min(320px, 60vw);
        height: auto;
        overflow: visible;
        display: block;
        transition: transform var(--dock-ms) cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* Dock toward the nav mark position. Refined once the nav exists. */
      #loader.docked #mark {
        transform: scale(var(--dock-scale)) translateY(calc(-1 * var(--dock-lift)));
      }
      /* Wordmark: Michroma, 34px large / 0.02em tracking per BRAND.md. Sits under
         the mark at all times and rises with it when the mark docks. */
      #loader .wordmark {
        position: relative;
        margin: 0;
        font: 400 clamp(22px, 5.5vw, 34px) / 1 'Michroma', sans-serif;
        letter-spacing: 0.02em;
        color: #f2f4fa;
        white-space: nowrap;
        user-select: none;
        transition: transform var(--dock-ms) cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #loader.docked .wordmark {
        transform: translateY(calc(-1 * var(--rise)));
      }
      /* Full word, invisible: holds the box width while letters are typed in. */
      #loader .wordmark .ghost {
        color: transparent;
      }
      #loader .wordmark .typed {
        position: absolute;
        inset: 0 auto 0 0;
      }
      /* Terminal block caret after the typed letters; gone once the mark docks. */
      #loader .wordmark .typed::after {
        content: '';
        display: inline-block;
        width: 0.5em;
        height: 0.95em;
        margin-left: 0.1em;
        vertical-align: -0.06em;
        background: #2ea8ff;
        animation: caret-blink 1s steps(1, end) infinite;
      }
      #loader.docked .wordmark .typed::after {
        display: none;
      }
      @keyframes caret-blink {
        50% {
          opacity: 0;
        }
      }
      #loader .row {
        width: min(320px, 60vw);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        transition: opacity 300ms;
      }
      #loader.docked .row {
        opacity: 0;
      }
      /* Status row and enter buttons share one slot under the mark. The enter
         stack is taller than the row; its top edge stays at the slot top. */
      #loader .foot {
        display: grid;
        place-items: center;
      }
      #loader .foot > * {
        grid-area: 1 / 1;
      }
      /* Enter buttons. Hidden until the mark has docked, then rise to sit under it. */
      #loader .enter {
        width: min(260px, 80vw);
        display: flex;
        flex-direction: column;
        gap: 12px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(calc(-1 * var(--rise) + 12px));
        /* Buttons fade and rise together with the mark's dock, same duration and ease. */
        transition:
          opacity var(--dock-ms),
          transform var(--dock-ms) cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s;
      }
      #loader.docked .enter {
        opacity: 1;
        visibility: visible;
        transform: translateY(calc(-1 * var(--rise)));
      }
      #loader .btn {
        appearance: none;
        cursor: pointer;
        width: 100%;
        padding: 12px 20px;
        border: 1px solid #2ea8ff;
        border-radius: 2px;
        background: transparent;
        color: #2ea8ff;
        font: 500 12px/1 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition:
          background 160ms,
          color 160ms,
          border-color 160ms;
      }
      #loader .btn:hover,
      #loader .btn:focus-visible {
        background: rgba(46, 168, 255, 0.12);
        outline: none;
      }
      #loader .btn.quiet {
        border-color: #4a5368;
        color: #8a94ab;
      }
      #loader .btn.quiet:hover,
      #loader .btn.quiet:focus-visible {
        border-color: #8a94ab;
        color: #c9d1e3;
        background: rgba(255, 255, 255, 0.04);
      }
      #loader .btn:disabled {
        cursor: default;
        opacity: 0.6;
      }
      /* Narrow screens: the mark box is shorter, so the buttons need less lift. */
      @media (max-width: 480px) {
        #loader {
          /* Narrower mark box (60vw), so its bottom edge moves less. */
          --rise: 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader.docked #mark {
          transform: none;
        }
        #loader .wordmark,
        #loader.docked .wordmark {
          transform: none;
          transition: none;
        }
        #loader .wordmark .typed::after {
          animation: none;
        }
        #loader .enter {
          transform: none;
          transition: opacity 300ms;
        }
        #loader.docked .enter {
          transform: none;
        }
      }
      #loader .lbl {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #4a5368;
        font-weight: 500;
      }
      #loader .pct {
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #8a94ab;
      }
    </style>
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <header class="nav">
      <a class="lockup" href="/" aria-label="CyberFish home">
        <img class="mark" src="/cyberfish-mark.svg" alt="" width="1620" height="640" />
        <span>CyberFish</span>
      </a>
    </header>
    <div id="loader">
      <svg id="mark" viewBox="30 -649 1620 640" aria-label="CyberFish">
        <defs>
          <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
            <feGaussianBlur stdDeviation="34" result="b1" />
            <feGaussianBlur stdDeviation="12" result="b2" />
            <feMerge>
              <feMergeNode in="b1" />
              <feMergeNode in="b2" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="edgeglow" x="-300%" y="-20%" width="700%" height="140%">
            <feGaussianBlur stdDeviation="20" />
          </filter>
          <clipPath id="clip"><rect id="cliprect" x="30" y="-700" width="0" height="760" /></clipPath>
          <path
            id="p"
            d="M70 -49V-185L346 -306Q366 -315 388.0 -321.0Q410 -327 423 -329Q410 -331 388.0 -336.5Q366 -342 346 -351L70 -472V-609L530 -401V-258Z M1070.0 -49 610.0 -257V-400L1070.0 -609V-473L794.0 -352Q774.0 -343 752.0 -337.0Q730.0 -331 717.0 -329Q730.0 -327 752.0 -321.5Q774.0 -316 794.0 -307L1070.0 -186Z M1150.0 -49V-185L1426.0 -306Q1446.0 -315 1468.0 -321.0Q1490.0 -327 1503.0 -329Q1490.0 -331 1468.0 -336.5Q1446.0 -342 1426.0 -351L1150.0 -472V-609L1610.0 -401V-258Z"
          />
        </defs>
        <use href="#p" fill="none" stroke="#2EA8FF" stroke-width="10" opacity="0.28" />
        <g clip-path="url(#clip)">
          <use id="halo" href="#p" fill="#2EA8FF" stroke="#2EA8FF" stroke-width="18" filter="url(#glow)" opacity="0.9" />
          <use href="#p" fill="#F4FBFF" stroke="#2EA8FF" stroke-width="18" paint-order="stroke fill" />
        </g>
        <g id="edge">
          <rect id="edgeblur" x="30" y="-680" width="14" height="720" fill="#7FD0FF" filter="url(#edgeglow)" opacity="0.9" />
          <rect id="edgeline" x="30" y="-680" width="6" height="720" fill="#FFFFFF" />
        </g>
      </svg>
      <!--
        Wordmark types out as the load progresses (driven by src/ui/loader.ts).
        The ghost copy reserves the full width so nothing shifts per letter and
        gives assistive tech the whole name; the typed overlay is visual only.
      -->
      <p class="wordmark">
        <span class="ghost">CYBERFISH</span>
        <span class="typed" id="typed" aria-hidden="true"></span>
      </p>
      <div class="foot">
        <div class="row" role="status" aria-live="polite">
          <div class="lbl" id="label">Loading content</div>
          <div class="pct" id="pct">0%</div>
        </div>
        <div class="enter" id="enter">
          <button class="btn" id="enter-sound" type="button">Enter with sound</button>
          <button class="btn quiet" id="enter-mute" type="button">Enter without sound</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
